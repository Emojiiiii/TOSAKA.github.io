# =====================================
# TOSAKA 网站 - Jekyll 配置
# =====================================
title: TOSAKA Portfolio
description: Game Design Portfolio
url: "https://emojiiiii.github.io"
baseurl: "/TOSAKA.github.io"
markdown: kramdown

# 内容集合：原 Journal + 新 Portfolio。互不混用内容。
collections:
  article:
    output: true
    permalink: /journal/entries/:name/

  work:
    output: true
    permalink: /work/projects/:name/

  # About Q&A 集合
  qa:
    output: false

theme: null

# 作品详情复用 Journal 的阅读模板与 CSS。
defaults:
  - scope:
      path: ""
      type: "article"
    values:
      layout: "journal-post"
  - scope:
      path: ""
      type: "work"
    values:
      layout: "journal-post"

# =====================================
# About Q&A - 访客提问接收地址
# =====================================
# Q&A API 接收地址
qa_form_endpoint: "https://tosaka-qa-api.lin-xinyuan.workers.dev/questions"

# Cloudflare Turnstile 公开 Site Key
qa_turnstile_site_key: "0x4AAAAAAFY-2IQgOMVtRDbc"

