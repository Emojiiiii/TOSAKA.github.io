
# =====================================
# TOSAKA 网站 - Jekyll 配置
# =====================================

# 网站基本信息
title: TOSAKA Portfolio
description: Game Design Portfolio

# 网站地址
url: "https://emojiiiii.github.io"
baseurl: "/TOSAKA.github.io"

# Markdown 解析器
markdown: kramdown

# =====================================
# Journal 文章集合
# =====================================

collections:
  journal:
    output: true
    permalink: /journal/entries/:name/

# 不使用第三方主题
theme: null

# =====================================
# Journal 文章模板
# =====================================

defaults:
  # 兼容当前旧文章
  - scope:
      path: "journal/content"
      type: "pages"
    values:
      layout: "journal-post"

  # 新 Journal 集合的文章
  - scope:
      path: ""
      type: "journal"
    values:
      layout: "journal-post"
